<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- CluadeX media editor (Views/Editor/MediaEditorHost.cs). One page per media tab: an image, a song or a clip from the
     project, served by the host from the file's folder (https://cluadex-media.example/, range requests, so a 2 GB video
     is never read whole). Every word on the page comes from the host (localized); colours come from the app's theme.
     Nothing here leaves the machine: the only origin it may load from is the file's own folder. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https://cluadex-media.example blob: data:; media-src https://cluadex-media.example blob:; connect-src https://cluadex-media.example blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root {
  --bg:#0B0F17; --panel:#11151E; --raised:#161B26; --border:#2A3142; --text:#E8ECF4; --muted:#8A93A6; --faint:#6B7385;
  --accent:#4CDFFF; --accent2:#A672FF; --danger:#FF6E6E; --ok:#5CFFB0; --warn:#FFD166; --hover:rgba(255,255,255,.06);
  --checkA:#1a1f2b; --checkB:#232a38;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:12px/1.35 "Segoe UI", "Leelawadee UI", Tahoma, sans-serif; overflow:hidden; user-select:none; }
button, select, input { font:inherit; color:inherit; }
#app { display:flex; flex-direction:column; height:100%; }
#bar { display:flex; align-items:center; flex-wrap:wrap; gap:4px; padding:5px 8px; background:var(--panel); border-bottom:1px solid var(--border); min-height:38px; }
#bar .grp { display:flex; align-items:center; gap:2px; }
#bar .sep { width:1px; height:20px; background:var(--border); margin:0 5px; }
#bar .spacer { flex:1; }
.btn { display:inline-flex; align-items:center; gap:5px; height:27px; padding:0 8px; border:1px solid transparent; border-radius:6px; background:transparent; cursor:pointer; white-space:nowrap; }
.btn:hover:not(:disabled) { background:var(--hover); border-color:var(--border); }
.btn:disabled { opacity:.38; cursor:default; }
.btn.on { background:color-mix(in srgb, var(--accent) 18%, transparent); border-color:var(--accent); color:var(--accent); }
.btn.icon { width:29px; padding:0; justify-content:center; }
.btn.primary { background:var(--accent); color:var(--bg); font-weight:600; }
.btn.primary:hover:not(:disabled) { filter:brightness(1.1); background:var(--accent); }
.btn.danger { color:var(--danger); }
.btn.danger:hover:not(:disabled) { border-color:var(--danger); background:color-mix(in srgb, var(--danger) 12%, transparent); }
.btn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
select, input[type=number] { height:26px; background:var(--raised); border:1px solid var(--border); border-radius:5px; padding:0 6px; }
input[type=number] { width:74px; }
input[type=range] { accent-color:var(--accent); }
label.chk { display:inline-flex; align-items:center; gap:4px; cursor:pointer; color:var(--muted); }
#stage { position:relative; flex:1; overflow:hidden; background:var(--bg); }
#foot { background:var(--panel); border-top:1px solid var(--border); }
#status { display:flex; gap:12px; align-items:center; padding:3px 10px; color:var(--muted); background:var(--panel); border-top:1px solid var(--border); min-height:22px; white-space:nowrap; overflow:hidden; }
#status .msg { margin-left:auto; color:var(--text); overflow:hidden; text-overflow:ellipsis; }
#status .msg.err { color:var(--danger); }
#status .msg.ok { color:var(--ok); }
.panel { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:20; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 10px; background:var(--raised); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 28px rgba(0,0,0,.35); }
.panel .lbl { color:var(--muted); }
#cover { position:absolute; inset:0; z-index:50; display:none; align-items:center; justify-content:center; background:color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter:blur(2px); }
#cover.show { display:flex; }
#cover .card { min-width:280px; max-width:440px; padding:16px 18px; background:var(--raised); border:1px solid var(--border); border-radius:10px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.4); }
#cover .bar { height:4px; border-radius:2px; background:var(--border); overflow:hidden; margin:12px 0; }
#cover .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .15s; }
#cover .bar.indet i { width:35%; animation:indet 1.1s ease-in-out infinite; }
@keyframes indet { 0% { margin-left:-35%; } 100% { margin-left:100%; } }
#notice { position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:24px; z-index:40; }
#notice.show { display:flex; }
#notice .card { max-width:520px; text-align:center; color:var(--muted); }
#notice .card b { display:block; color:var(--text); font-size:15px; margin-bottom:6px; }
#notice .glyph { font-size:40px; opacity:.5; margin-bottom:10px; }
/* image */
#imgwrap { position:absolute; transform-origin:0 0; background-color:var(--checkA);
  background-image:linear-gradient(45deg, var(--checkB) 25%, transparent 25%), linear-gradient(-45deg, var(--checkB) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, var(--checkB) 75%), linear-gradient(-45deg, transparent 75%, var(--checkB) 75%);
  background-size:16px 16px; background-position:0 0, 0 8px, 8px -8px, -8px 0; box-shadow:0 0 0 1px var(--border); }
#imgwrap canvas, #imgwrap img { display:block; width:100%; height:100%; }
#imgwrap.pixel canvas, #imgwrap.pixel img { image-rendering:pixelated; }
#crop { position:absolute; z-index:10; box-shadow:0 0 0 99999px rgba(0,0,0,.55); outline:1px solid #fff; cursor:move; }
#crop .h { position:absolute; width:12px; height:12px; margin:-6px 0 0 -6px; background:#fff; border:1px solid #000; border-radius:2px; }
#crop .g { position:absolute; inset:0; pointer-events:none; background:
  linear-gradient(to right, transparent 33.2%, rgba(255,255,255,.35) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.35) 66.6%, transparent 66.8%),
  linear-gradient(to bottom, transparent 33.2%, rgba(255,255,255,.35) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.35) 66.6%, transparent 66.8%); }
#crop .dim { position:absolute; left:50%; top:100%; transform:translate(-50%, 6px); padding:1px 6px; border-radius:4px; background:rgba(0,0,0,.7); color:#fff; white-space:nowrap; }
/* audio */
#wave { position:absolute; left:0; right:0; top:0; bottom:28px; cursor:text; }
#overview { position:absolute; left:0; right:0; bottom:0; height:28px; cursor:pointer; border-top:1px solid var(--border); }
#transport { display:flex; align-items:center; gap:6px; padding:6px 10px; flex-wrap:wrap; }
#transport .time { font:13px/1 Consolas, "Cascadia Mono", monospace; color:var(--text); min-width:170px; }
#transport .sel { color:var(--muted); font-family:Consolas, monospace; }
/* video */
#vidbox { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
#vidbox video { max-width:100%; max-height:100%; }
#timeline { display:block; width:100%; height:74px; cursor:pointer; }
.kbd { color:var(--faint); font-size:11px; }
/* text layers (image + video) */
canvas.tov { position:absolute; left:0; top:0; pointer-events:none; z-index:5; }
#tpanel { position:absolute; top:10px; right:10px; bottom:10px; width:308px; z-index:25; overflow:auto; padding:10px 12px; display:flex; flex-direction:column; gap:7px;
  background:var(--raised); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 28px rgba(0,0,0,.35); }
#tpanel .row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
#tpanel .lbl { color:var(--muted); min-width:58px; }
#tpanel h4 { margin:6px 0 0; font-size:11px; font-weight:600; color:var(--faint); letter-spacing:.03em; }
#tpanel textarea { width:100%; min-height:62px; max-height:180px; resize:vertical; padding:6px 7px; border:1px solid var(--border); border-radius:5px; background:var(--bg); color:var(--text);
  font:14px/1.4 "Leelawadee UI", Tahoma, "Segoe UI", "Segoe UI Emoji", sans-serif; user-select:text; }
#tpanel input[type=color] { width:30px; height:24px; padding:0 1px; border:1px solid var(--border); border-radius:4px; background:var(--bg); cursor:pointer; }
#tpanel input[type=number] { width:62px; }
#tpanel input[type=range] { width:96px; }
#tpanel .note { color:var(--warn); font-size:11px; }
#tpanel .note:empty { display:none; }
input[type=text] { height:26px; background:var(--raised); border:1px solid var(--border); border-radius:5px; padding:0 6px; }
.fontpick { position:relative; flex:1; min-width:150px; }
.fontpick input { width:100%; }
.fontlist { position:absolute; left:0; right:0; top:28px; max-height:260px; overflow:auto; z-index:30; display:none; background:var(--panel); border:1px solid var(--border); border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
.fontlist.show { display:block; }
.fontlist div { padding:4px 8px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:15px; }
.fontlist div:hover, .fontlist div.on { background:var(--hover); }
.fontlist .none { color:var(--muted); font-size:12px; cursor:default; }
</style>
</head>
<body>
<div id="app">
  <div id="bar"></div>
  <div id="stage"><div id="notice"><div class="card"></div></div></div>
  <div id="foot"></div>
  <div id="status"><span id="info"></span><span class="msg" id="msg"></span></div>
</div>
<div id="cover"><div class="card"><div id="coverText"></div><div class="bar" id="coverBar"><i></i></div><button class="btn" id="coverCancel"></button></div></div>
<script>
'use strict';
// ───────────────────────────── host link ─────────────────────────────
const HOST = window.chrome && chrome.webview;
const post = m => { try { HOST && HOST.postMessage(m); } catch (e) { } };
let S = {};                    // localized strings (media.page.* → text)

let ED = null;                 // the active editor (image / audio / video)

let burnProgress = null;       // { id, fn(f) } while ffmpeg renders a video's text

const waiters = new Map();

  crop:'M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2', resize:'M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7',
  rotl:'M2.5 2v6h6M2.66 15.57a10 10 0 1 0 .57-8.38', rotr:'M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38',
  fliph:'M12 3v18M16 7l4 5-4 5M8 7l-4 5 4 5', flipv:'M3 12h18M7 8l5-4 5 4M7 16l5 4 5-4',
  sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
  fit:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5', zin:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3M11 8v6M8 11h6', zout:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3M8 11h6',
  play:'M6 4l14 8-14 8z', pause:'M7 4h3v16H7zM14 4h3v16h-3z', stop:'M6 6h12v12H6z', loop:'M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3',
  scissors:'M6 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12',
  trash:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6', fadein:'M3 20 21 4M3 20h18', fadeout:'M3 4l18 16M3 20h18', vol:'M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14',
  mute:'M11 5 6 9H2v6h4l5 4zM23 9l-6 6M17 9l6 6', norm:'M3 12h4l3-8 4 16 3-8h4', silence:'M3 12h18',
  camera:'M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2zM12 9a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',
  prev:'M19 20 9 12l10-8zM5 19V5', next:'M5 4l10 8-10 8zM19 5v14', inpt:'M4 4v16M8 12h12M14 6l6 6-6 6', outpt:'M20 4v16M16 12H4M10 6l-6 6 6 6',
  save:'M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8', over:'M12 3v12M7 10l5 5 5-5M5 21h14',
  code:'M16 18l6-6-6-6M8 6l-6 6 6 6', check:'M20 6 9 17l-5-5', x:'M18 6 6 18M6 6l12 12', zsel:'M3 7V3h4M21 7V3h-4M3 17v4h4M21 17v4h-4M8 12h8',
  text:'M4 7V4h16v3M9 20h6M12 4v16', plus:'M12 5v14M5 12h14', bold:'M6 4h7a4 4 0 0 1 0 8H6zM6 12h8a4 4 0 0 1 0 8H6z', italic:'M19 4h-9M14 20H5M15 4 9 20',
  aleft:'M3 6h18M3 12h12M3 18h16', acenter:'M3 6h18M6 12h12M4 18h16', aright:'M3 6h18M9 12h12M5 18h16', layers:'M12 2 2 7l10 5 10-5zM2 17l10 5 10-5M2 12l10 5 10-5',
};
function svg(name) { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', ICON[name] || ''); s.append(p); return s; }

  const b = el('button', { cls: 'btn' + (opts.label ? '' : ' icon') + (opts.cls ? ' ' + opts.cls : ''), tip: opts.tip || key, on: { click: e => { e.preventDefault(); if (!b.disabled) fn(e); } } });

function applyStrings(root = document) {

}
function fmtTime(t, precise = true) {
  if (!isFinite(t) || t < 0) t = 0;
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t - h * 3600 - m * 60;
  const ss = precise ? s.toFixed(3).padStart(6, '0') : String(Math.floor(s)).padStart(2, '0');
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + ss;

function fmtSize(b) { if (b < 1024) return b + ' B'; const k = b / 1024; if (k < 1024) return k.toFixed(k < 10 ? 1 : 0) + ' KB'; const m = k / 1024; if (m < 1024) return m.toFixed(m < 10 ? 1 : 0) + ' MB'; return (m / 1024).toFixed(2) + ' GB'; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const canon = e => ({ jpeg: 'jpg', jfif: 'jpg', jpe: 'jpg', oga: 'ogg' }[e] || e);

let msgTimer = 0;
function say(text, kind = '') {
  const m = $('msg'); m.textContent = text || ''; m.className = 'msg ' + kind;
  clearTimeout(msgTimer); if (text && kind !== 'err') msgTimer = setTimeout(() => { m.textContent = ''; }, 6000);

function notice(title, body, glyph = '◌') {
  const n = $('notice'), c = n.querySelector('.card');
  c.replaceChildren(el('div', { cls: 'glyph' }, glyph), el('b', {}, title), el('div', {}, body || ''));
  n.classList.add('show');
}
function hideNotice() { $('notice').classList.remove('show'); }
function setDirty(on) { if (setDirty.last !== on) { setDirty.last = on; post({ t: 'dirty', on }); } }

// ───────────────────────────── busy cover ─────────────────────────────
function setBusy(text, onCancel, indet = true) {
  busy = { cancel: onCancel };
  $('coverText').textContent = text;
  $('coverBar').classList.toggle('indet', indet);
  $('coverBar').firstElementChild.style.width = indet ? '' : '0%';
  const c = $('coverCancel'); c.textContent = L('media.page.cancel'); c.style.display = onCancel ? '' : 'none';
  $('cover').classList.add('show');
  refreshSaveButtons();
}
function setProgress(f) { $('coverBar').classList.remove('indet'); $('coverBar').firstElementChild.style.width = Math.round(clamp(f, 0, 1) * 100) + '%'; }

// ───────────────────────────── saving: bytes go to the host in acked chunks ─────────────────────────────
function waitFor(id, kinds) { return new Promise(res => waiters.set(id, { kinds, res })); }

const CHUNK = 768 * 1024;

function report(r, okText) {
  if (r && r.ok) say(okText || L('media.page.saved', r.name || ''), 'ok');

  else say(r && r.text ? r.text : L('media.page.saveFailed'), 'err');
  return !!(r && r.ok);
}

// ───────────────────────────── shared toolbar bits ─────────────────────────────
const bar = $('bar'), stage = $('stage'), foot = $('foot');
const saveUi = { copy: null, over: null, fmt: null, q: null, qwrap: null };
function saveGroup(withFormat) {

    for (const [v, k] of [['png', 'PNG'], ['jpg', 'JPEG'], ['webp', 'WebP']]) saveUi.fmt.append(el('option', { value: v }, k));

}

  saveUi.over.disabled = !!busy || !st.over;
