name: Build & Release

# Fires on main AND on the long-lived feature branch. The old workflow only
# watched main, and main had not moved since 2026-04-04 while 77 commits piled
# up on the feature branch — so for four months every push built nothing and
# shipped nothing, and the app's own updater correctly reported "no update"
# against a v2.2.26 release while running v3.0.5x. A release pipeline that only
# fires on a branch nobody merges to is a pipeline that does not exist.
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two release builds racing would fight over the same tag. Newer pushes cancel
# older in-flight runs so only the latest tip is ever published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build embeds `git rev-parse --short HEAD` into
          # InformationalVersion (see CluadeX.csproj EmbedGitCommitHash), so the
          # checkout needs real history, not a grafted shallow clone.
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content "CluadeX/CluadeX.csproj" -Raw
          $ver = [regex]::Match($content, '<Version>(\d+\.\d+\.\d+)</Version>').Groups[1].Value
          if (-not $ver) { throw "Could not read <Version> from CluadeX.csproj" }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG=v$ver" >> $env:GITHUB_OUTPUT
          echo "## CluadeX $ver" >> $env:GITHUB_STEP_SUMMARY
          echo "- commit: ``$(git rev-parse --short HEAD)``" >> $env:GITHUB_STEP_SUMMARY

      - name: Restore dependencies
        run: dotnet restore CluadeX.sln

      - name: Build Release
        run: dotnet build CluadeX.sln -c Release --no-restore --nologo

      - name: Publish (win-x64, self-contained)
        # ReadyToRun: precompiled code, so start-up and each page's first visit don't wait for the JIT (the Portable
        # profile already did this; the released build did not).
        run: dotnet publish CluadeX/CluadeX.csproj -c Release -r win-x64 --self-contained -o publish --nologo -p:ErrorOnDuplicatePublishOutputFiles=false -p:PublishReadyToRun=true

      - name: Fetch the previous release (base for the delta)
        # vpk pack writes CluadeX-<ver>-delta.nupkg only when the previous release's full package sits in Releases/.
        # Without this step there never was a delta: every update downloaded the whole ~500 MB package (owner
        # 2026-10-20: "โหลดช้าก็ตัด"). A delta carries only the files that changed. If the fetch fails, this release
        # ships without one and installed apps take the full package as before.
        shell: pwsh
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet tool install -g vpk --version 1.1.1
          $v = '${{ steps.version.outputs.VERSION }}'
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir Releases
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::no previous release fetched — this release has no delta package"; Remove-Item Releases -Recurse -Force -ErrorAction SilentlyContinue; exit 0 }
          # A re-run of a version that is already published: a delta against itself makes no sense, and pack would refuse.
          if (Get-ChildItem Releases -Filter "CluadeX-$v-*" -ErrorAction SilentlyContinue) { Write-Host "::warning::v$v is already published — no delta"; Remove-Item Releases -Recurse -Force; exit 0 }
          Get-ChildItem Releases | ForEach-Object { Write-Host "delta base: $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }

      - name: Velopack pack (self-update assets)
        # Produces Releases/ — *-full.nupkg, *-delta.nupkg, CluadeX-win-Setup.exe
        # and RELEASES. AutoUpdateService's UpdateManager(GithubSource) reads
        # exactly these assets off the release to self-update.
        #
        # NOTE: only builds INSTALLED from Setup.exe can auto-update. Moving off
        # the portable zip is a ONE-TIME manual install; every version after that
        # arrives on its own, as a delta.
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false   # a failed pack is handled below, not thrown
          if (-not (Get-Command vpk -ErrorAction SilentlyContinue)) { dotnet tool install -g vpk --version 1.1.1 }
          $v = '${{ steps.version.outputs.VERSION }}'
          function Pack {
            vpk pack `
              --packId CluadeX `
              --packVersion $v `
              --packDir publish `
              --mainExe CluadeX.exe `
              --icon CluadeX/Assets/app.ico `
              --packTitle "CluadeX" `
              --packAuthors "Xman Studio" `
              --outputDir Releases
          }
          Pack
          # The delta is an extra: if packing against the previous release fails, the release still ships (full only).
          if ($LASTEXITCODE -ne 0 -and (Get-ChildItem Releases -Filter 'CluadeX-*-full.nupkg' -ErrorAction SilentlyContinue | Where-Object Name -ne "CluadeX-$v-full.nupkg")) {
            Write-Host "::warning::pack with a delta failed — packing the full package only"
            Remove-Item Releases -Recurse -Force
            Pack
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The previous full package was only the delta's base: it is already on its own release, not uploaded again.
          Get-ChildItem Releases -Filter 'CluadeX-*-full.nupkg' | Where-Object Name -ne "CluadeX-$v-full.nupkg" | Remove-Item -Force
          Get-ChildItem Releases | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }
          $delta = Get-Item "Releases/CluadeX-$v-delta.nupkg" -ErrorAction SilentlyContinue
          if ($delta) { echo "- delta package: $([math]::Round($delta.Length / 1MB, 1)) MB" >> $env:GITHUB_STEP_SUMMARY } else { echo "- no delta package (full only)" >> $env:GITHUB_STEP_SUMMARY }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CluadeX-${{ steps.version.outputs.VERSION }}-x64
          path: Releases/*
          retention-days: 30

      - name: Create Release
        # Publishing is deliberately narrower than building. Every push to a feat/**
        # branch BUILDS and uploads an artifact you can download from the run; only
        # main — or an explicit "Run workflow" — mints a public tag and release.
        # A PR (possibly from a fork) can never publish.
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: CluadeX ${{ steps.version.outputs.TAG }}
          body: |
            ## CluadeX ${{ steps.version.outputs.TAG }}

            AI Coding Assistant by Xman Studio — https://xman4289.com

            ### Install
            - **First time / switching from portable:** download **`CluadeX-win-Setup.exe`** and run it.
              Installed builds update themselves from then on — new versions download in the
              background as deltas and apply on restart.
            - **Portable:** download `CluadeX-win-Portable.zip`, extract, run `CluadeX.exe`.
              Portable builds detect new releases but cannot self-update.

            ### Requirements
            - Windows 10 1809+ (x64)
            - Local mode: a GGUF model, or [Ollama](https://ollama.com)
          files: Releases/*
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
